name: Supabase Keepalive

on:
  schedule:
    - cron: '0 3 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (auth health)
        run: |
          URL="${{ secrets.SUPABASE_URL }}/auth/v1/health"
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" "$URL")
          echo "HTTP $CODE"
          cat /tmp/body
          # Any 2xx-4xx response means the server is alive
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ]; then
            echo "Supabase is alive"
            exit 0
          else
            echo "Supabase unreachable"
            exit 1
          fi
